services:
  # PicShare Express REST API
  - type: web
    name: picshare-api
    runtime: node
    plan: free
    rootDir: PicShare/backend
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20.18.3
      - key: PORT
        value: 10000
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLIENT_URL
        sync: false
      - key: MAX_FILE_SIZE_BYTES
        value: 5242880

  # PicShare Angular 11 Client
  - type: web
    name: picshare-client
    runtime: static
    plan: free
    rootDir: PicShare/frontend/picshare-client
    buildCommand: npm install && npm run build
    staticPublishPath: dist/picshare-client
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_OPTIONS
        value: --openssl-legacy-provider
      - key: NODE_VERSION
        value: 18.20.7
