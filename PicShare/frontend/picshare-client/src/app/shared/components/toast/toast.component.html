<div
  *ngIf="toast$ | async as toast"
  class="toast-banner"
  [ngClass]="'toast-' + toast.variant"
  role="status"
  aria-live="polite"
>
  <span class="toast-text">{{ toast.text }}</span>
  <button type="button" class="toast-close" aria-label="Dismiss notification" (click)="dismiss()">
    &times;
  </button>
</div>
