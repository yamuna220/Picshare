<!-- Mobile Top Bar -->
<header class="mobile-top-bar">
  <a routerLink="/" class="brand-wordmark">PicShare</a>
  <div class="mobile-top-actions">
    <a routerLink="/requests" routerLinkActive="active-icon" class="icon-link icon-badge-host" aria-label="Follow Requests">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
        <circle cx="8.5" cy="7" r="4"></circle>
        <line x1="20" y1="8" x2="20" y2="14"></line>
        <line x1="23" y1="11" x2="17" y2="11"></line>
      </svg>
      <span
        *ngIf="(pendingRequestsCount$ | async) as pendingCount"
        class="nav-badge nav-badge-compact"
        [attr.aria-label]="pendingCount + ' pending follow requests'"
      >
        {{ formatBadge(pendingCount) }}
      </span>
    </a>

    <a routerLink="/notifications" routerLinkActive="active-icon" class="icon-link icon-badge-host" aria-label="Notifications">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
      </svg>
      <span
        *ngIf="(unreadCount$ | async) as unreadCount"
        class="nav-badge nav-badge-compact"
        [attr.aria-label]="unreadCount + ' unread notifications'"
      >
        {{ formatBadge(unreadCount) }}
      </span>
    </a>

    <a routerLink="/settings" routerLinkActive="active-icon" class="icon-link" aria-label="Settings">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
      </svg>
    </a>
  </div>
</header>

<!-- Desktop / Tablet Left Navigation Rail -->
<aside class="desktop-sidebar" aria-label="Primary navigation">
  <div class="sidebar-brand">
    <a routerLink="/" class="brand-wordmark">PicShare</a>
    <a routerLink="/" class="brand-monogram" aria-label="PicShare Home">P</a>
  </div>

  <nav class="sidebar-nav">
    <a
      routerLink="/"
      routerLinkActive="nav-active"
      [routerLinkActiveOptions]="{ exact: true }"
      class="nav-item"
    >
      <svg class="nav-icon" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
        <polyline points="9 22 9 12 15 12 15 22"></polyline>
      </svg>
      <span class="nav-label">Home</span>
    </a>

    <a routerLink="/search" routerLinkActive="nav-active" class="nav-item">
      <svg class="nav-icon" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <span class="nav-label">Search</span>
    </a>

    <a routerLink="/explore" routerLinkActive="nav-active" class="nav-item">
      <svg class="nav-icon" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
      </svg>
      <span class="nav-label">Explore</span>
    </a>

    <a routerLink="/notifications" routerLinkActive="nav-active" class="nav-item">
      <span class="nav-icon-wrap">
        <svg class="nav-icon" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
        </svg>
      </span>
      <span class="nav-label">Notifications</span>
      <span
        *ngIf="(unreadCount$ | async) as unreadCount"
        class="nav-badge"
        [attr.aria-label]="unreadCount + ' unread notifications'"
      >
        {{ formatBadge(unreadCount) }}
      </span>
    </a>

    <a routerLink="/requests" routerLinkActive="nav-active" class="nav-item">
      <span class="nav-icon-wrap">
        <svg class="nav-icon" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
          <circle cx="8.5" cy="7" r="4"></circle>
          <line x1="20" y1="8" x2="20" y2="14"></line>
          <line x1="23" y1="11" x2="17" y2="11"></line>
        </svg>
      </span>
      <span class="nav-label">Requests</span>
      <span
        *ngIf="(pendingRequestsCount$ | async) as pendingCount"
        class="nav-badge"
        [attr.aria-label]="pendingCount + ' pending follow requests'"
      >
        {{ formatBadge(pendingCount) }}
      </span>
    </a>

    <a routerLink="/create" routerLinkActive="nav-active" class="nav-item">
      <svg class="nav-icon" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="4"></rect>
        <line x1="12" y1="8" x2="12" y2="16"></line>
        <line x1="8" y1="12" x2="16" y2="12"></line>
      </svg>
      <span class="nav-label">Create Post</span>
    </a>

    <a routerLink="/profile" routerLinkActive="nav-active" class="nav-item">
      <ng-container *ngIf="currentUser$ | async as user; else defaultProfileIcon">
        <app-user-avatar
          [src]="user.profilePicture"
          [username]="user.username"
          size="sm"
        ></app-user-avatar>
        <span class="nav-label">{{ user.username }}</span>
      </ng-container>
      <ng-template #defaultProfileIcon>
        <svg class="nav-icon" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
        <span class="nav-label">Profile</span>
      </ng-template>
    </a>

    <a routerLink="/settings" routerLinkActive="nav-active" class="nav-item">
      <svg class="nav-icon" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
      </svg>
      <span class="nav-label">Settings</span>
    </a>
  </nav>

  <div class="sidebar-footer">
    <ng-container *ngIf="isAuthenticated; else guestLinks">
      <button type="button" class="nav-item nav-button" (click)="onLogout()">
        <svg class="nav-icon" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
        <span class="nav-label">Log out</span>
      </button>
    </ng-container>

    <ng-template #guestLinks>
      <a routerLink="/login" routerLinkActive="nav-active" class="nav-item">
        <svg class="nav-icon" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
          <polyline points="10 17 15 12 10 7"></polyline>
          <line x1="15" y1="12" x2="3" y2="12"></line>
        </svg>
        <span class="nav-label">Sign in</span>
      </a>
    </ng-template>
  </div>
</aside>

<!-- Mobile Bottom Tab Bar -->
<nav class="mobile-bottom-bar" aria-label="Mobile navigation">
  <a
    routerLink="/"
    routerLinkActive="active-icon"
    [routerLinkActiveOptions]="{ exact: true }"
    class="icon-link"
    aria-label="Home"
  >
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
      <polyline points="9 22 9 12 15 12 15 22"></polyline>
    </svg>
  </a>
  <a routerLink="/search" routerLinkActive="active-icon" class="icon-link" aria-label="Search">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="8"></circle>
      <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
    </svg>
  </a>
  <a routerLink="/explore" routerLinkActive="active-icon" class="icon-link" aria-label="Explore">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
    </svg>
  </a>
  <a routerLink="/create" routerLinkActive="active-icon" class="icon-link" aria-label="Create Post">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="3" width="18" height="18" rx="4"></rect>
      <line x1="12" y1="8" x2="12" y2="16"></line>
      <line x1="8" y1="12" x2="16" y2="12"></line>
    </svg>
  </a>
  <a routerLink="/profile" routerLinkActive="active-icon" class="icon-link" aria-label="Profile">
    <ng-container *ngIf="currentUser$ | async as user; else mobileProfileIcon">
      <app-user-avatar
        [src]="user.profilePicture"
        [username]="user.username"
        size="sm"
      ></app-user-avatar>
    </ng-container>
    <ng-template #mobileProfileIcon>
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
        <circle cx="12" cy="7" r="4"></circle>
      </svg>
    </ng-template>
  </a>
</nav>
