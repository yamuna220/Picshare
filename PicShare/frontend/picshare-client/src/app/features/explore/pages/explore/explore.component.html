<div class="ps-page-container">
  <header class="ps-page-header">
    <div>
      <h1 class="ps-page-title">Explore</h1>
      <p class="ps-page-subtitle">Curated photographs from public creators and accounts you follow.</p>
    </div>
    <a routerLink="/search" class="ps-btn ps-btn-secondary">Search People</a>
  </header>

  <app-loading-spinner *ngIf="isLoading" label="Loading photographs..."></app-loading-spinner>

  <div *ngIf="!isLoading && errorMessage" class="ps-alert ps-alert-error" role="alert">
    {{ errorMessage }}
  </div>

  <ng-container *ngIf="!isLoading && !errorMessage">
    <div *ngIf="posts.length > 0" class="ps-photo-grid">
      <a
        *ngFor="let post of posts"
        [routerLink]="['/posts', post.id]"
        class="ps-grid-tile"
        [attr.aria-label]="post.caption ? 'View photograph by @' + post.author.username + ': ' + post.caption : 'View photograph by @' + post.author.username"
      >
        <img
          *ngIf="post.imageUrl | authMedia | async as safeUrl"
          [src]="safeUrl"
          [alt]="post.caption || 'Photograph by ' + post.author.username"
          referrerpolicy="no-referrer"
        />

        <div class="ps-grid-overlay">
          <div class="ps-grid-metrics tabular-nums">
            <span class="ps-grid-metric">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.5">
                <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
              </svg>
              <span>{{ post.likesCount }}</span>
            </span>
            <span class="ps-grid-metric">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.5">
                <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
              </svg>
              <span>{{ post.commentsCount }}</span>
            </span>
          </div>
          <span class="ps-grid-author">@{{ post.author.username }}</span>
        </div>
      </a>
    </div>

    <app-empty-state
      *ngIf="posts.length === 0"
      title="Nothing to explore yet"
      description="Share a photograph or follow creators to populate the community gallery."
      actionLabel="Create Post"
      actionRoute="/create"
    ></app-empty-state>

    <div *ngIf="hasMore" class="explore-more">
      <button
        type="button"
        class="ps-btn ps-btn-secondary"
        [disabled]="isLoadingMore"
        (click)="onLoadMore()"
      >
        {{ isLoadingMore ? 'Loading...' : 'Load more photographs' }}
      </button>
    </div>
  </ng-container>
</div>
